<div class="body-overlay" id="overlay-filepicker">
	<div class="inner-overlay">
		<div>
			<h4 class="title">
				Choix d'un fichier
			</h4>
		</div>
		
		<div class="files-list-wrap">
			<div class="files-list-container"></div>
				<div class='external form-action-wrap linear'>
					<div class='form-action'>
						<button class='action-btn fetch-all'><span class='text'>Afficher tout</span><span class="spinner"></span></button>
					</div>
				</div>
			
			<div class="file-preview" active><img></div>
		</div>
		
		<div class='box'><div class="error file-choice"></div></div>
		
		<div class='external form-action-wrap linear'>
			<div class='form-action'>
				<button class='action-btn validate'>Poursuivre</button>
			</div>
			<div class='form-action'>
				<button class='action-btn cancel'>Annuler</button>
			</div>
		</div>
	</div>
</div>
