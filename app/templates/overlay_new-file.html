<div class="body-overlay" id="overlay-add">
	<div class="inner-overlay">
		<div>
			<h4 class="title">
				Ajouter un fichier
			</h4>
		</div>

		<form id="overlay-add-form">
			<div class='box pic'>
				<div class='frame input-container'>
					<div class='drag-zone centered'>
						<span>
							<div>Déposez un fichier pour l'ajouter aux documents accessibles.</div>
							<div class='file-formats'><small>Formats supportés : .pdf</small></div>
							<div class='file-maxsize'><small>Taille maximale : 2 Mo</small></div>
						</span>
						
						<div class="form-action-wrap">
							<div class="form-action">
								<div class='action-btn new-file'>Choisir un nouveau fichier</div>
							</div>
							<div class="form-action">
								<div class='action-btn exist-file'>Choisir un fichier existant</div>
							</div>
						</div>
						
						<div class='overlay-panel rounded frame-overlay centered'>
							<span>Lâcher le fichier pour l'ajouter</span>
							<div class='icon extra-large inline file'><span class='img'></span></div>
						</div>
					</div>
					<div class="visual">
						<small>Fichier sélectionné : <span class="selected-file"></span></small>
						<div class='icon medium inline delete dynamic hoverable'><span class='img'></span></div>
					</div>
					<input class='fileentry hidden' type='file' accept='application/pdf' name='file' id='file' autocomplete=off placeholder="Affiche" title="Veuillez sélectionner un visuel pour l'évènement" required>
				</div>
				<div class='error file'></div>
			</div>
			
			<div class='box filename'>
				<div class='input-header'>
					<label class='label' for='filename'>Nom du fichier</label>
				</div>
				<div class='input-container'>
					<input class='lineentry' type='text' name='filename' id='filename' autocomplete=off placeholder="Nom du fichier" title="Nom du fichier" required>
					<span>.</span>
					<input class='lineentry' type='text' name='fileextension' id='fileextension' autocomplete=off placeholder="ext" title="Extension du fichier" style="width: 5em" required disabled>
				</div>
			</div>
			
			<div class='box description'>
				<div class='input-header'>
					<label class='label' for='desc'>Description pour le fichier</label>
				</div>
				<div class='input-container'>
					<input class='lineentry' type='text' name='desc' id='desc' autocomplete=off placeholder="Description" title="Description pour le fichier" required>
				</div>
			</div>

			<div class='external form-action-wrap linear'>
				<div class='form-action'>
					<button class='action-btn validate' type='submit'>Poursuivre</button>
				</div>
				<div class='form-action'>
					<div class='action-btn cancel'>Annuler</div>
				</div>
			</div>
		</form>
	</div>
</div>
